[project]
name = "edp-control-plane"
version = "1.0.0"
description = "Control-plane service for the Enterprise DevOps Platform"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
dependencies = [
    "fastapi==0.115.2",
    "uvicorn[standard]==0.31.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "prometheus-client==0.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "../tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "S", "SIM", "RUF"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"../tests/*" = ["S", "N"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
